name: Go test and run

on:
  push:
    tags:
      - '*'

permissions:
  contents: write # Дает право создавать релизы и загружать файлы

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    # 1. Скачиваем код вашего репозитория на сервер GitHub
    - name: Check out code
      uses: actions/checkout@v4

    # 2. Устанавливаем язык Go нужной версии
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22' # Укажите версию Go, как в вашем go.mod

    # 3. Скачиваем зависимости (если они есть)
    - name: Install dependencies
      run: go mod download

    # 4. Проверяем, собирается ли ваш проект
    # Так как файлы в src, мы проверяем сборку всей папки
    - name: Build project
      run: go build -v -o app ./src/.

    # Собираем релиз
    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@v5
      with:
        # either 'goreleaser' (default) or 'goreleaser-pro'
        distribution: goreleaser
        # 'latest', 'nightly', or a semver
        version: latest
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}